name: Static Site Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Validate static site files
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f render.yaml
          test -f robots.txt
          test -f sitemap.xml
      - name: Validate primary domain references
        run: |
          grep -q 'https://dryogeshshepal.in' index.html
          grep -q 'https://dryogeshshepal.in/sitemap.xml' robots.txt
